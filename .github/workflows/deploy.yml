name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0 # resume-sync compares when the PDF and the text last changed

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      # The newer of public/resume.pdf and src/data/resume.json is the source;
      # the other is regenerated in this workspace only, so nothing is
      # committed back. Arial comes from the Microsoft core fonts so a rendered
      # PDF uses the Doc's face.
      - name: Sync resume text and PDF
        run: |
          echo "ttf-mscorefonts-installer msttcorefonts/accept-mscorefonts-eula select true" | sudo debconf-set-selections
          sudo apt-get install -y -qq ttf-mscorefonts-installer >/dev/null || echo "Arial install failed; Helvetica fallback"
          pip install --quiet pymupdf
          python scripts/resume-sync.py build

      - name: Build
        run: npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
