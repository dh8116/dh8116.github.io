name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write # the resume sync commits regenerated files back to main
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2 # resume-sync diffs against the previous commit

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Whichever of resume.pdf / resume.json this commit changed, rebuild the
      # other from it, then commit the result so main matches what deploys.
      # A push made with GITHUB_TOKEN does not start another workflow run.
      - name: Sync resume text and PDF
        run: |
          pip install --quiet pymupdf
          python scripts/resume-sync.py
          if [ -n "$(git status --porcelain public/resume.pdf public/resume-preview.png src/data/resume.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
            git add public/resume.pdf public/resume-preview.png src/data/resume.json
            git commit -m "Sync resume text and PDF"
            git pull --rebase origin main
            git push origin HEAD:main
          fi

      - name: Build
        run: npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
